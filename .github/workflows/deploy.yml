name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Type Check
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            dist/
            package.json
            package-lock.json

  deploy-render:
    name: Deploy to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deployment..."
          curl -f -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment hook triggered successfully!"

  deploy-vps:
    name: Deploy to VPS via SSH
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        if: secrets.SSH_HOST != ''
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: ./deploy-dist

      - name: Copy files to VPS
        if: secrets.SSH_HOST != ''
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "./deploy-dist/*"
          target: "${{ secrets.DEPLOY_PATH }}"
          strip_components: 1

      - name: Execute remote commands (SSH)
        if: secrets.SSH_HOST != ''
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            npm ci --omit=dev
            # Restart or start application with PM2
            pm2 restart margen-portfolio || pm2 start dist/server.cjs --name "margen-portfolio"

  deploy-docker:
    name: Build & Push Docker Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        if: secrets.DOCKER_USERNAME != ''
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/margen-portfolio:latest
            ${{ secrets.DOCKER_USERNAME }}/margen-portfolio:${{ github.sha }}
